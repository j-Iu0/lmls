[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmls-studio"
version = "0.1.0"
description = "Local Livesub Studio backend: graph editor API, playback session, and static SPA host"
requires-python = ">=3.11"
dependencies = [
    "livesub",
    "aiohttp>=3.12,<4",
    "tomli-w>=1.2,<2",
]

[project.scripts]
studio = "lmls_studio.cli:app_main"

[tool.setuptools.package-data]
"lmls_studio" = ["studio/index.html", "studio/assets/*"]

[tool.setuptools.packages.find]
include = ["lmls_studio*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]