# Caption a video file, a stream URL, or system audio instead of the microphone.
# Only the input node differs from default.toml -- every other stage is untouched,
# because ffmpeg normalises whatever it is given to the same 16 kHz mono frames the
# microphone produces.
#
#   lmls run --config config/video.toml                     # the url below
#   lmls run --config config/video.toml --source "Background Music" --device
#   lmls run --config config/video.toml --source lecture.mp4
#
# On Linux with PipeWire, capture all application audio instead (no url needed):
# replace the source options with
#
#   pulse = true                  # default output monitor -- hears every app
#   pulse = "alsa_output.usb-...monitor"   # a specific sink/source via `pactl`

[settings]
target = "vi"

[[node]]
name = "src"
impl = "ffmpeg"
out = "audio.raw"
url = "assets/lecture.wav"
realtime = true

[[node]]
name = "vad"
impl = "energy"
in = "audio.raw"
out = "utterance.speech"

[[node]]
name = "asr"
impl = "faster_whisper"
in = "utterance.speech"
out = "text.raw"
model = "small.en"

[[node]]
name = "fix_translate"
impl = "fused_ollama"
in = "text.raw"
out = { corrected = "text.corrected", translated = "text.out" }
target = "vi"

[[node]]
name = "screen"
impl = "stdout_pretty"
in = ["text.raw", "text.corrected", "text.out"]